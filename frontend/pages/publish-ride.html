<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish Ride - CarpoolMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config={theme:{extend:{colors:{'surface-container-low':'#f2f3ff','secondary':'#006c49','surface-variant':'#dae2fd','surface-container-lowest':'#ffffff','on-secondary':'#ffffff','secondary-container':'#6cf8bb','on-secondary-container':'#00714d','error-container':'#ffdad6','on-error-container':'#93000a','error':'#ba1a1a','on-error':'#ffffff','primary-container':'#2563eb','on-primary-container':'#eeefff','on-primary':'#ffffff','on-surface':'#131b2e','on-surface-variant':'#434655','surface-container':'#eaedff','surface-container-high':'#e2e7ff','surface-container-highest':'#dae2fd','surface':'#faf8ff','primary':'#004ac6','primary-fixed':'#dbe1ff','on-primary-fixed':'#00174b','secondary-fixed':'#6ffbbe','outline':'#737686','outline-variant':'#c3c6d7'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased">
  <header class="fixed top-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]" id="app-header"></header>

  <main class="pt-20 pb-12">
    <div class="max-w-6xl mx-auto px-4 lg:px-8">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-on-surface flex items-center gap-2">
          <span class="material-symbols-outlined text-secondary text-3xl">add_circle</span>Publish a Ride
        </h1>
        <p class="text-sm text-on-surface-variant mt-1">Create a one-time or recurring ride for other students</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Map -->
        <div class="bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden order-2 lg:order-1">
          <div class="p-4 border-b border-outline-variant/50">
            <div class="flex items-center gap-2 text-sm font-semibold text-on-surface">
              <span class="material-symbols-outlined text-lg text-primary">map</span>Route Preview
            </div>
            <p class="text-xs text-on-surface-variant mt-1">Click on the map or search to set locations</p>
            <div class="flex gap-2 mt-3">
              <button type="button" id="pick-origin-btn" onclick="setPickMode('origin')"
                class="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-primary text-on-primary text-xs font-semibold shadow-sm transition-all">
                <span class="material-symbols-outlined text-sm">trip_origin</span>Set Pickup
              </button>
              <button type="button" id="pick-dest-btn" onclick="setPickMode('dest')"
                class="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl border-2 border-secondary text-secondary text-xs font-semibold transition-all">
                <span class="material-symbols-outlined text-sm">location_on</span>Set Drop-off
              </button>
            </div>
          </div>
          <div id="map" class="w-full" style="height:450px;"></div>
        </div>

        <!-- Form -->
        <div class="bg-surface-container-lowest rounded-2xl shadow-sm p-6 order-1 lg:order-2">
          <div id="error-msg"></div>

          <form id="ride-form" class="space-y-5">
            <!-- Origin -->
            <div>
              <div class="flex items-center gap-2 mb-3">
                <div class="w-8 h-8 rounded-lg bg-primary-fixed text-primary flex items-center justify-center">
                  <span class="material-symbols-outlined text-lg">trip_origin</span>
                </div>
                <h3 class="text-base font-semibold text-on-surface">Pickup Location</h3>
              </div>
              <div class="relative mb-2">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-lg text-on-surface-variant">search</span>
                <input type="text" id="origin-search" placeholder="Search pickup location..." autocomplete="off"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                <div id="origin-results" class="absolute top-full left-0 right-0 z-30 mt-1 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/50 hidden max-h-48 overflow-y-auto"></div>
              </div>
              <div id="origin-display" class="hidden flex items-center gap-2 px-3 py-2 rounded-xl bg-primary-fixed/30 text-sm">
                <span class="material-symbols-outlined text-lg text-primary">trip_origin</span>
                <span id="origin-name-display" class="flex-1 font-medium text-on-surface"></span>
                <button type="button" onclick="clearLocation('origin')" class="text-on-surface-variant hover:text-error">
                  <span class="material-symbols-outlined text-lg">close</span>
                </button>
              </div>
              <input type="hidden" id="originLat" required>
              <input type="hidden" id="originLng" required>
              <input type="hidden" id="originName">
            </div>

            <!-- Destination -->
            <div>
              <div class="flex items-center gap-2 mb-3">
                <div class="w-8 h-8 rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center">
                  <span class="material-symbols-outlined text-lg">location_on</span>
                </div>
                <h3 class="text-base font-semibold text-on-surface">Drop-off Location</h3>
              </div>
              <div class="relative mb-2">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-lg text-on-surface-variant">search</span>
                <input type="text" id="dest-search" placeholder="Search drop-off location..." autocomplete="off"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all">
                <div id="dest-results" class="absolute top-full left-0 right-0 z-30 mt-1 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/50 hidden max-h-48 overflow-y-auto"></div>
              </div>
              <div id="dest-display" class="hidden flex items-center gap-2 px-3 py-2 rounded-xl bg-secondary-container/30 text-sm">
                <span class="material-symbols-outlined text-lg text-secondary">location_on</span>
                <span id="dest-name-display" class="flex-1 font-medium text-on-surface"></span>
                <button type="button" onclick="clearLocation('dest')" class="text-on-surface-variant hover:text-error">
                  <span class="material-symbols-outlined text-lg">close</span>
                </button>
              </div>
              <input type="hidden" id="destLat" required>
              <input type="hidden" id="destLng" required>
              <input type="hidden" id="destName">
            </div>

            <div class="border-t border-outline-variant"></div>

            <!-- Schedule -->
            <div>
              <div class="flex items-center gap-2 mb-3">
                <div class="w-8 h-8 rounded-lg bg-primary-fixed text-primary flex items-center justify-center">
                  <span class="material-symbols-outlined text-lg">schedule</span>
                </div>
                <h3 class="text-base font-semibold text-on-surface">Schedule</h3>
              </div>

              <!-- Schedule Type Toggle -->
              <div class="flex rounded-xl border border-outline-variant overflow-hidden mb-3">
                <button type="button" id="toggle-once" onclick="setScheduleType('once')"
                  class="flex-1 px-3 py-2 text-xs font-semibold text-center transition-all">One Time</button>
                <button type="button" id="toggle-weekly" onclick="setScheduleType('weekly')"
                  class="flex-1 px-3 py-2 text-xs font-semibold text-center transition-all bg-primary text-on-primary">Repeat Weekly</button>
              </div>

              <!-- Once: date picker -->
              <div id="once-fields" class="hidden mb-3">
                <label for="tripDate" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Date</label>
                <input type="date" id="tripDate"
                  class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
              </div>

              <!-- Weekly: weekday chips + date range -->
              <div id="weekly-fields" class="mb-3">
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1.5">Days</label>
                <div class="flex flex-wrap gap-1.5 mb-3" id="weekday-chips"></div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label for="startDate" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Start Date</label>
                    <input type="date" id="startDate"
                      class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                  </div>
                  <div>
                    <label for="duration" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Duration</label>
                    <select id="duration"
                      class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                      <option value="1w">1 week</option>
                      <option value="2w">2 weeks</option>
                      <option value="1m" selected>1 month</option>
                      <option value="3m">3 months</option>
                      <option value="custom">Custom end date</option>
                    </select>
                  </div>
                </div>
                <div id="custom-end-wrapper" class="hidden mt-3">
                  <label for="endDate" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">End Date</label>
                  <input type="date" id="endDate"
                    class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
              </div>

              <!-- Schedule preview -->
              <div id="schedule-preview" class="px-3 py-2 rounded-xl bg-primary-fixed/30 text-xs font-medium text-on-surface mb-3 hidden">
                <span class="material-symbols-outlined text-sm align-middle text-primary mr-1">event</span>
                <span id="preview-text"></span>
              </div>

              <!-- Departure Time -->
              <div>
                <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Departure Time</label>
                <div class="flex gap-1.5">
                  <select id="depHour" required class="flex-1 px-1 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface text-center focus:outline-none focus:ring-2 focus:ring-primary transition-all">
                    <option value="">--</option>
                    <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
                    <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
                  </select>
                  <span class="flex items-center text-on-surface-variant font-bold">:</span>
                  <select id="depMin" required class="flex-1 px-1 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface text-center focus:outline-none focus:ring-2 focus:ring-primary transition-all">
                    <option value="">--</option>
                    <option>00</option><option>05</option><option>10</option><option>15</option><option>20</option><option>25</option>
                    <option>30</option><option>35</option><option>40</option><option>45</option><option>50</option><option>55</option>
                  </select>
                  <select id="depAmpm" class="flex-1 px-1 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface text-center font-semibold focus:outline-none focus:ring-2 focus:ring-primary transition-all">
                    <option>AM</option><option>PM</option>
                  </select>
                </div>
                <input type="hidden" id="departureTime">
              </div>
            </div>

            <div class="border-t border-outline-variant"></div>

            <!-- Details -->
            <div>
              <div class="flex items-center gap-2 mb-3">
                <div class="w-8 h-8 rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center">
                  <span class="material-symbols-outlined text-lg">tune</span>
                </div>
                <h3 class="text-base font-semibold text-on-surface">Details</h3>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label for="seats" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Available Seats</label>
                  <input type="number" id="seats" min="1" max="8" value="3" required
                    class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
                <div>
                  <label for="fare" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Fare in EGP <span class="text-outline">(optional)</span></label>
                  <input type="number" step="0.01" id="fare" placeholder="e.g. 45.00"
                    class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
              </div>
              <div class="mt-3">
                <label for="pickupRadius" class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1">Pickup Area Radius (km)</label>
                <input type="number" step="0.1" id="pickupRadius" value="2.0" min="0.5" max="10"
                  class="w-full px-3 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
              </div>
            </div>

            <button type="submit"
              class="w-full py-3 rounded-xl bg-secondary text-on-secondary text-sm font-semibold shadow-md hover:opacity-95 transition-all flex items-center justify-center gap-2">
              <span class="material-symbols-outlined text-lg">publish</span>Publish Ride
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/location-picker.js"></script>
  <script src="../assets/js/pages/publish-ride.js"></script>
</body>
</html>
